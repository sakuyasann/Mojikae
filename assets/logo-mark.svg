<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mojikae">
  <!--
    Mojikae のロゴマーク。
    スキャン枠（ページを読み取る）+ 小文字の m + アクセントのドット。
    アイコン生成の元データなので、色と座標はここが唯一の情報源。

    枠は 112..400（線幅 32・角丸 46）。ドットは枠の右上角へ内接させている。
  -->
  <g
    fill="none"
    stroke="#232b33"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- 左上のかぎ -->
    <path d="M112 213V158a46 46 0 0 1 46-46h55" />
    <!-- 左下のかぎ -->
    <path d="M112 299v55a46 46 0 0 0 46 46h55" />
    <!-- 右下のかぎ -->
    <path d="M400 299v55a46 46 0 0 1-46 46h-55" />
    <!-- 上辺の破線部 -->
    <path d="M259 112h42" />
    <!-- 右辺の破線部（ドットの下） -->
    <path d="M400 201v30" />
    <!-- 中央の m -->
    <path d="M182 310v-70a37 37 0 0 1 74 0v70" />
    <path d="M256 240a37 37 0 0 1 74 0v70" />
  </g>
  <!-- 右上のアクセントドット（枠の角に内接） -->
  <circle cx="362" cy="150" r="38" fill="#10d9c4" />
</svg>
